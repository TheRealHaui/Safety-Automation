# Air config for live-reload during development
root = "."
tmp_dir = "tmp"

[build]
  # -ldflags -X patches gitCommit into the binary on every hot-reload so the footer
  # always reflects the exact commit (plus "-dirty" when there are uncommitted changes).
  # Air executes this string through the shell, so $(git ...) substitution works here.
  cmd = "go build -ldflags=\"-X 'github.com/TheRealHaui/Safety-Automation/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)$(git diff --quiet 2>/dev/null || echo -dirty)'\" -o ./tmp/resilience-tester ./cmd/server/main.go"
  bin = "tmp/resilience-tester"
  delay = 200
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js"]
  include_dir = ["cmd", "internal", "web"]
  exclude_dir = ["tmp", "vendor", ".git"]
  stop_on_error = true

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"
