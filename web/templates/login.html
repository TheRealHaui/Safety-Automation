{{define "login_template"}}
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8"/>
  <title>Sign In – Safety Automation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center">
<div class="w-full max-w-sm">
  <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
    <!-- Header -->
    <div class="bg-gray-900 px-8 py-6 text-center">
      <div class="text-3xl mb-1">⚡</div>
      <h1 class="text-white text-xl font-semibold">Safety Automation</h1>
      <p class="text-gray-400 text-xs mt-1">OpenShift Resilience Testing Platform</p>
    </div>

    <!-- Form -->
    <div class="px-8 py-6">
      {{with .Data}}
        {{with .Error}}
        <div class="mb-4 px-3 py-2 bg-red-50 border border-red-200 rounded text-sm text-red-700">
          {{.}}
        </div>
        {{end}}
      {{end}}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Username</label>
          <input type="text" name="username" required autofocus
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" required
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>
        <button type="submit"
          class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition">
          Sign In
        </button>
      </form>
    </div>
  </div>
  {{/*
    <p class="text-center text-xs text-gray-400 mt-4">Default credentials: admin / admin</p>
  */}}
</div>
</body>
</html>
{{end}}
