apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hoplon.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hoplon.labels" . | nindent 4 }}
rules:
  # Read Kubernetes Deployments and allow rollout restart (patch/update).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Read OpenShift DeploymentConfigs and allow rollout restart (patch/update).
  - apiGroups: ["apps.openshift.io"]
    resources: ["deploymentconfigs"]
    verbs: ["get", "list", "watch", "patch", "update"]

  # Read and delete pods (pod kill scenario, recovery time measurement, orphan scan).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  # Create, read, and delete ConfigMaps for K6 test scripts.
  # Trade-off: Kubernetes resourceNames does not support wildcards so this grants
  # access to ALL ConfigMaps in the namespace. K6 script ConfigMaps are generated
  # with dynamic names per run, making exact-match locking impractical without
  # restricting to a single concurrent test. Namespace owners should ensure no
  # sensitive data is stored in ConfigMaps.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "delete"]

  # Create, monitor, and delete K6 load test Jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

  # Create and delete Istio VirtualServices for HTTP delay/error injection scenarios
  # and to scan for orphaned VSes left by a previous crashed run at startup.
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["create", "get", "list", "delete"]
