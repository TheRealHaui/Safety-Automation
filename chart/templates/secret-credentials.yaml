apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hoplon.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hoplon.labels" . | nindent 4 }}
# stringData lets you supply plain-text values — Kubernetes base64-encodes them
# automatically before storing. This avoids manual base64 encoding in values.yaml
# for string values (binary wallet files are handled separately in secret-wallet.yaml).
type: Opaque
stringData:
  # Required — application refuses to start if ORACLE_DSN is empty (see main.go).
  ORACLE_DSN:          {{ required "oracle.dsn is required" .Values.oracle.dsn | quote }}
  # Session signing key. Defaults exist in config.go but are insecure — always override.
  SESSION_SECRET:      {{ required "app.sessionSecret is required" .Values.app.sessionSecret | quote }}
  SESSION_ENCRYPT_KEY: {{ required "app.sessionEncryptKey is required" .Values.app.sessionEncryptKey | quote }}
  # Grafana service account token — sensitive, stored in Secret not ConfigMap.
  # Must have Editor permission on the Public Grafana org (not Main Org — a Main Org token
  # silently misroutes annotations and they never appear on the dashboard).
  GRAFANA_TOKEN:       {{ required "grafana.token is required" .Values.grafana.token | quote }}
