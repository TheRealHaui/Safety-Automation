{{- if .Values.oracle.localNaming.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hoplon.fullname" . }}-local-naming
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hoplon.labels" . | nindent 4 }}
type: Opaque
# The local-naming Secret is mounted as a volume (not envFrom) because the Oracle
# native C library needs actual files on disk at the TNS_ADMIN path. It reads them
# at library load time — before main() runs. The mountPath in deployment.yaml must
# match ENV TNS_ADMIN in the Dockerfile exactly, otherwise misleading ORA-12506
# ACL errors appear.
stringData:
  tnsnames.ora: {{ required "oracle.localNaming.tnsnames is required when oracle.localNaming.enabled is true" .Values.oracle.localNaming.tnsnames | quote }}
  sqlnet.ora:   {{ required "oracle.localNaming.sqlnet is required when oracle.localNaming.enabled is true" .Values.oracle.localNaming.sqlnet | quote }}
  {{- if .Values.oracle.localNaming.wallet.enabled }}
  ewallet.pem:      {{ .Values.oracle.localNaming.wallet.ewalletPem | quote }}
  ojdbc.properties: {{ .Values.oracle.localNaming.wallet.ojdbcProperties | quote }}
  {{- end }}
{{- if .Values.oracle.localNaming.wallet.enabled }}
# Binary wallet files must be base64-encoded and go under data (not stringData).
# Kubernetes decodes data values before writing them to the mounted volume, so the
# Oracle client receives the original binary content.
data:
  cwallet.sso: {{ required "oracle.localNaming.wallet.cwalletSso is required when oracle.localNaming.wallet.enabled is true" .Values.oracle.localNaming.wallet.cwalletSso }}
  ewallet.p12: {{ required "oracle.localNaming.wallet.ewalletP12 is required when oracle.localNaming.wallet.enabled is true" .Values.oracle.localNaming.wallet.ewalletP12 }}
{{- end }}
{{- end }}
